<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="author" content="Min Thet Lwin" />
  <meta
    name="description"
    content="Min Thet Lwin — mid-senior full-stack developer at Property Lab Myanmar. Building reliable backends with Laravel and Spring Boot, and polished React interfaces. Explore experience, projects and case studies."
  />

  <title>Min Thet Lwin | Portfolio</title>

  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (e) {}
  </script>

  <!-- Favicon & Manifest -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Fonts (SF Pro is used on Apple devices; Inter elsewhere) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://minthetlwin.site/" />
  <meta property="og:title" content="Min Thet Lwin | Portfolio" />
  <meta property="og:description" content="Mid-senior full-stack developer at Property Lab Myanmar. Laravel, Spring Boot and React — explore experience, projects and case studies." />
  <meta property="og:image" content="https://minthetlwin.site/preview-img.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://minthetlwin.site/" />
  <meta name="twitter:title" content="Min Thet Lwin | Portfolio" />
  <meta name="twitter:description" content="Mid-senior full-stack developer at Property Lab Myanmar. Laravel, Spring Boot and React — explore experience, projects and case studies." />
  <meta name="twitter:image" content="https://minthetlwin.site/preview-img.png" />
</head>
<body>
  <noscript>You need to enable JavaScript to view this portfolio.</noscript>
  <div id="root"></div>
</body>
</html>
